<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>七色国纪</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- 右上角汉堡菜单 -->
    <div class="menu-container">
        <div class="menu-icon" id="menuIcon">
            <span></span>
            <span></span>
            <span></span>
        </div>
        <div class="dropdown-menu" id="dropdownMenu">
            <a href="index.html" class="menu-item">世界观介绍</a>
            <a href="prologue.html" class="menu-item">序·别来无恙</a>
            <a href="chapter1.html" class="menu-item">第一章·时过境迁</a>
            <a href="chapter2.html" class="menu-item">第二章·色争于野</a>
            <a href="chapter3.html" class="menu-item">第三章·染尽诸彩</a>
            <a href="last.html" class="menu-item">结局</a>
        </div>
    </div>

    <!-- 标题 -->
    <div class="title">
        <img src="title.png" alt="七色国纪" class="title-image">
    </div>

    <!-- 战场信息栏 -->
    <div class="battle-section">
        <h2 class="battle-title">⚔️第三章·染尽诸彩 ⚔️</h2>
        <div class="battle-date">2026.05.20 - 2026.05.29</div>
        <div class="battle-container">
            <div class="battle-card" id="battle1" data-battle-img="3-1.png">
                <div class="battle-name">此暗将至</div>
                <div class="battle-countries">红国 橙国 蓝国</div>
            </div>
            <div class="battle-card" id="battle2" data-battle-img="3-2.png">
                <div class="battle-name">造物之殇</div>
                <div class="battle-countries">青国 紫国 白国</div>
            </div>
            <div class="battle-card" id="battle3" data-battle-img="3-3.png">
                <div class="battle-name">生而行猎</div>
                <div class="battle-countries">黄国 绿国 黑国</div>
            </div>
        </div>
    </div>

    <!-- 红黑斜纹警戒线 -->
    <div class="hazard-line"></div>

    <!-- 额外按钮区域 -->
    <div class="extra-button-section">
        <button class="extra-button" id="suddenBtn" style="color: #C40000;">突发剧情</button>
        <button class="extra-button" id="rankBtn">贡献度排行</button>
    </div>

    <!-- 主要内容区 -->
    <div class="main-content">
        <!-- 地图容器 -->
        <div class="map-container">
            <svg id="map" viewBox="0 0 2682 1688">
                <!-- 8个国家的路径将通过JS添加 -->
            </svg>
            
            <!-- 蓝国国徽按钮（右下角）- 文字和图标已分离 -->
            <div class="underground-emblem" id="undergroundEmblem">
                <div class="emblem-icon">
                    <img src="icons/blue.png" alt="蓝国">
                </div>
                <div class="emblem-name">*蓝国领土位于魔界，点击国徽查看相关信息</div>
            </div>
        </div>
    </div>

    <!-- 图片弹窗层（地图国家用） -->
    <div class="image-popup" id="imagePopup">
        <div class="popup-content">
            <button class="popup-close" id="popupClose">×</button>
            <img id="popupImage" src="" alt="国家图片">
            <p id="popupCaption"></p>
        </div>
    </div>

    <!-- 战场图片弹窗 -->
    <div class="image-popup" id="battlePopup">
        <div class="popup-content battle-popup-content">
            <button class="popup-close" id="battlePopupClose">×</button>
            <div class="image-viewer" id="imageViewer">
                <div class="image-viewer-wrapper">
                    <img id="battlePopupImage" src="" alt="战场图片" class="viewer-image">
                </div>
            </div>
        </div>
    </div>

    <!-- 额外按钮专用弹窗 -->
    <div class="image-popup" id="infoPopup">
        <div class="popup-content info-popup-content">
            <button class="popup-close" id="infoPopupClose">×</button>
            <div class="info-image-viewer">
                <img id="infoPopupImage" src="" alt="图片">
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
