<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>结局 - 七色国纪</title>
    <link rel="stylesheet" href="style.css">
    <style>
        /* 结局页面专用样式 */
        .last-page .battle-section {
            margin-bottom: 30px;
        }

        .last-page .battle-container {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 40px;
            flex-wrap: wrap;
        }

        .last-page .activity-button {
            padding: 20px 60px;
            font-size: 1.6rem;
            font-weight: bold;
            color: #E0E0E0;
            background: rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(8px);
            border: 2px solid #E0E0E0;
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.3s ease;
            font-family: inherit;
            letter-spacing: 6px;
            min-width: 200px;
        }

        .last-page .activity-button:hover {
            background: rgba(255, 255, 255, 0.2);
            border-color: #BA4A73;
            color: #E0E0E0;
            transform: scale(1.05);
            box-shadow: 0 0 15px rgba(255, 215, 0, 0.3);
        }

        .last-page .activity-button:active {
            transform: scale(0.98);
        }

        /* 弹窗内容容器 - 给箭头留空间 */
        .last-page .info-popup-content {
            padding: 20px 60px;
        }

        /* 图片外层容器 */
        .last-page .info-image-wrapper {
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            height: 80vh;
        }

        /* 图片查看器 - 滚动 */
        .last-page .info-image-viewer {
            display: flex;
            justify-content: center;
            align-items: flex-start;
            width: 100%;
            height: 100%;
            overflow: auto;
            background: rgba(0, 0, 0, 0.5);
            border-radius: 10px;
            padding: 20px;
        }

        .last-page .info-image-viewer img {
            display: block;
            width: auto;
            height: auto;
            max-width: none;
            max-height: none;
            object-fit: none;
        }

        /* 左右箭头 - 在图片框外部 */
        .last-page .nav-arrow {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            background: rgba(0, 0, 0, 0.7);
            border: 2px solid rgba(255, 255, 255, 0.5);
            border-radius: 50%;
            color: white;
            font-size: 3rem;
            width: 55px;
            height: 55px;
            cursor: pointer;
            transition: all 0.3s ease;
            z-index: 20;
            display: flex;
            align-items: center;
            justify-content: center;
            user-select: none;
            line-height: 1;
            padding: 0;
            text-align: center;
        }

        .last-page .nav-arrow:hover {
            background: rgba(255, 255, 255, 0.3);
            border-color: #ffd700;
            transform: translateY(-50%) scale(1.1);
        }

        .last-page .nav-left {
            left: -45px;
        }

        .last-page .nav-right {
            right: -45px;
        }

        /* 图片计数器 */
        .last-page .image-counter {
            text-align: center;
            color: #fff;
            font-size: 1rem;
            padding: 10px 0;
            background: rgba(0, 0, 0, 0.5);
            border-radius: 0 0 10px 10px;
            margin-top: 5px;
        }

        /* 单张图片时隐藏计数器 */
        .last-page .image-counter.hidden {
            display: none;
        }

        /* 单张图片时隐藏箭头 */
        .last-page .nav-arrow.hidden {
            display: none;
        }

        /* 自定义滚动条 */
        .last-page .info-image-viewer::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }

        .last-page .info-image-viewer::-webkit-scrollbar-track {
            background: rgba(0, 0, 0, 0.3);
            border-radius: 4px;
        }

        .last-page .info-image-viewer::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.4);
            border-radius: 4px;
        }

        .last-page .info-image-viewer::-webkit-scrollbar-thumb:hover {
            background: rgba(255, 255, 255, 0.6);
        }

        /* 响应式：小屏幕按钮上下排列 */
        @media (max-width: 600px) {
            .last-page .battle-container {
                flex-direction: column;
                gap: 20px;
            }
            .last-page .activity-button {
                min-width: 200px;
                padding: 16px 40px;
                font-size: 1.3rem;
            }
            .last-page .nav-left {
                left: -10px;
            }
            .last-page .nav-right {
                right: -10px;
            }
            .last-page .nav-arrow {
                width: 40px;
                height: 40px;
                font-size: 2rem;
            }
        }
    </style>
</head>
<body class="last-page">

    <!-- 右上角汉堡菜单 -->
    <div class="menu-container">
        <div class="menu-icon" id="menuIcon">
            <span></span>
            <span></span>
            <span></span>
        </div>
        <div class="dropdown-menu" id="dropdownMenu">
            <a href="index.html" class="menu-item">世界观介绍</a>
            <a href="prologue.html" class="menu-item">序·别来无恙</a>
            <a href="chapter1.html" class="menu-item">第一章·时过境迁</a>
            <a href="chapter2.html" class="menu-item">第二章·色争于野</a>
            <a href="chapter3.html" class="menu-item">第三章·染尽诸彩</a>
            <a href="last.html" class="menu-item">后日谈</a>
        </div>
    </div>

    <!-- 标题 -->
    <div class="title">
        <img src="title.png" alt="七色国纪" class="title-image">
    </div>

    <!-- 信息栏 - 两个按钮并排居中 -->
    <div class="battle-section">
        <h2 class="battle-title">📖 后日谈 📖</h2>
        <div class="battle-container">
            <button class="activity-button" id="activityBtn1">其一</button>
            <button class="activity-button" id="activityBtn2">其二</button>
        </div>
    </div>

    <!-- 主要内容区 -->
    <div class="main-content">
        <div class="map-container">
            <svg id="map" viewBox="0 0 2682 1688">
                <!-- 8个国家的路径将通过JS添加 -->
            </svg>

            <div class="underground-emblem" id="undergroundEmblem">
                <div class="emblem-icon">
                    <img src="icons/blue.png" alt="蓝国">
                </div>
                <div class="emblem-name">*蓝国领土位于魔界，点击国徽查看相关信息</div>
            </div>
        </div>
    </div>

    <!-- 图片弹窗层（地图国家用） -->
    <div class="image-popup" id="imagePopup">
        <div class="popup-content">
            <button class="popup-close" id="popupClose">×</button>
            <img id="popupImage" src="" alt="国家图片">
            <p id="popupCaption"></p>
        </div>
    </div>

    <!-- 图片弹窗（支持多图滑动） -->
    <div class="image-popup" id="infoPopup">
        <div class="popup-content info-popup-content">
            <button class="popup-close" id="infoPopupClose">×</button>
            <div class="info-image-wrapper">
                <button class="nav-arrow nav-left" id="navLeft">‹</button>
                <div class="info-image-viewer">
                    <img id="infoPopupImage" src="" alt="图片">
                </div>
                <button class="nav-arrow nav-right" id="navRight">›</button>
            </div>
            <div class="image-counter" id="imageCounter">1 / 3</div>
        </div>
    </div>

    <script src="script.js"></script>
    <script>
        // ==================== 页面初始化 ====================
        window.onload = function() {
            if (typeof initMap === 'function') {
                initMap();
            }
            if (typeof initPopupEvents === 'function') {
                initPopupEvents();
            }
            initMenu();
        };

        // ==================== 汉堡菜单 ====================
        function initMenu() {
            var menuIcon = document.getElementById('menuIcon');
            var dropdownMenu = document.getElementById('dropdownMenu');

            if (menuIcon && dropdownMenu) {
                menuIcon.addEventListener('click', function(e) {
                    e.stopPropagation();
                    dropdownMenu.classList.toggle('show');
                });

                document.addEventListener('click', function() {
                    dropdownMenu.classList.remove('show');
                });

                document.querySelectorAll('.menu-item').forEach(function(item) {
                    item.addEventListener('click', function() {
                        dropdownMenu.classList.remove('show');
                    });
                });
            }
        }

        // ==================== 蓝国国徽 ====================
        var undergroundEmblem = document.getElementById('undergroundEmblem');
        if (undergroundEmblem) {
            undergroundEmblem.addEventListener('click', function() {
                var popup = document.getElementById('imagePopup');
                var popupImage = document.getElementById('popupImage');
                var popupCaption = document.getElementById('popupCaption');
                var title = document.querySelector('.title');
                var battleSection = document.querySelector('.battle-section');
                if (title) title.style.visibility = 'hidden';
                if (battleSection) battleSection.style.visibility = 'hidden';
                popupImage.src = 'images/blue.png';
                popupCaption.textContent = '蓝国';
                popup.classList.add('show');
            });
        }

        // ==================== 图片弹窗关闭 ====================
        var popup = document.getElementById('imagePopup');
        var popupClose = document.getElementById('popupClose');

        if (popupClose) {
            popupClose.addEventListener('click', function() {
                popup.classList.remove('show');
                var title = document.querySelector('.title');
                var battleSection = document.querySelector('.battle-section');
                if (title) title.style.visibility = 'visible';
                if (battleSection) battleSection.style.visibility = 'visible';
            });
        }

        if (popup) {
            popup.addEventListener('click', function(e) {
                if (e.target === popup) {
                    popup.classList.remove('show');
                    var title = document.querySelector('.title');
                    var battleSection = document.querySelector('.battle-section');
                    if (title) title.style.visibility = 'visible';
                    if (battleSection) battleSection.style.visibility = 'visible';
                }
            });
        }

        // ==================== 多图滑动弹窗 ====================
        var infoPopup = document.getElementById('infoPopup');
        var infoPopupImage = document.getElementById('infoPopupImage');
        var infoPopupClose = document.getElementById('infoPopupClose');
        var navLeft = document.getElementById('navLeft');
        var navRight = document.getElementById('navRight');
        var imageCounter = document.getElementById('imageCounter');
        var title = document.querySelector('.title');
        var battleSection = document.querySelector('.battle-section');

        // ===== 图片配置 =====
        var imageSets = {
            // 其一：多张图片（左右滑动）
            set1: {
                images: ['images2/1.png', 'images2/2.png', 'images2/3.png'],
                currentIndex: 0
            },
            // 其二：单张图片（无箭头、无计数器）
            set2: {
                images: ['images2/4.png'],
                currentIndex: 0
            }
        };

        var currentSet = 'set1';

        function openImageSet(setName) {
            currentSet = setName;
            var set = imageSets[setName];
            if (!set || set.images.length === 0) return;
            set.currentIndex = 0;
            
            var isSingle = set.images.length <= 1;
            
            // 显示/隐藏箭头和计数器
            if (navLeft) navLeft.classList.toggle('hidden', isSingle);
            if (navRight) navRight.classList.toggle('hidden', isSingle);
            if (imageCounter) imageCounter.classList.toggle('hidden', isSingle);
            
            showImage(setName, set.currentIndex);
            infoPopup.classList.add('show');
            if (title) title.style.visibility = 'hidden';
            if (battleSection) battleSection.style.visibility = 'hidden';
            updateCounter(setName);
        }

        function showImage(setName, index) {
            var set = imageSets[setName];
            if (!set) return;
            if (index < 0) index = set.images.length - 1;
            if (index >= set.images.length) index = 0;
            set.currentIndex = index;
            infoPopupImage.src = set.images[index];
            updateCounter(setName);
        }

        function updateCounter(setName) {
            var set = imageSets[setName];
            if (!set) return;
            if (imageCounter) {
                imageCounter.textContent = (set.currentIndex + 1) + ' / ' + set.images.length;
            }
        }

        function closeInfoPopup() {
            infoPopup.classList.remove('show');
            if (title) title.style.visibility = 'visible';
            if (battleSection) battleSection.style.visibility = 'visible';
        }

        // 左右箭头事件
        if (navLeft) {
            navLeft.addEventListener('click', function(e) {
                e.stopPropagation();
                if (currentSet) {
                    showImage(currentSet, imageSets[currentSet].currentIndex - 1);
                }
            });
        }

        if (navRight) {
            navRight.addEventListener('click', function(e) {
                e.stopPropagation();
                if (currentSet) {
                    showImage(currentSet, imageSets[currentSet].currentIndex + 1);
                }
            });
        }

        // 键盘左右键支持
        document.addEventListener('keydown', function(e) {
            if (!infoPopup || !infoPopup.classList.contains('show')) return;
            var set = imageSets[currentSet];
            if (!set || set.images.length <= 1) return;
            if (e.key === 'ArrowLeft') {
                e.preventDefault();
                showImage(currentSet, set.currentIndex - 1);
            } else if (e.key === 'ArrowRight') {
                e.preventDefault();
                showImage(currentSet, set.currentIndex + 1);
            }
        });

        // ==================== 按钮事件绑定 ====================
        // 其一：多图（战后剧情）
        var activityBtn1 = document.getElementById('activityBtn1');
        if (activityBtn1) {
            activityBtn1.addEventListener('click', function() {
                openImageSet('set1');
            });
        }

        // 其二：单图（新增）
        var activityBtn2 = document.getElementById('activityBtn2');
        if (activityBtn2) {
            activityBtn2.addEventListener('click', function() {
                openImageSet('set2');
            });
        }

        // ==================== 关闭弹窗 ====================
        if (infoPopupClose) {
            infoPopupClose.addEventListener('click', closeInfoPopup);
        }

        if (infoPopup) {
            infoPopup.addEventListener('click', function(e) {
                if (e.target === infoPopup) closeInfoPopup();
            });
        }

        // ==================== ESC键关闭 ====================
        document.addEventListener('keydown', function(e) {
            if (e.key === 'Escape') {
                if (infoPopup && infoPopup.classList.contains('show')) {
                    closeInfoPopup();
                }
                if (popup && popup.classList.contains('show')) {
                    popup.classList.remove('show');
                    var titleEl = document.querySelector('.title');
                    var battleSectionEl = document.querySelector('.battle-section');
                    if (titleEl) titleEl.style.visibility = 'visible';
                    if (battleSectionEl) battleSectionEl.style.visibility = 'visible';
                }
            }
        });
    </script>

</body>
</html>
